<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Rôles & Mandats</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
    <div class="page-header-inner">
        <div>
            <div class="page-header-label">Gouvernance</div>
            <h1 class="page-header-title">Rôles & Mandats</h1>
        </div>
    </div>
</div>

<div class="content">

    <div class="panel">
        <div class="panel-title"><i class="ti ti-crown" style="color:var(--copper);"></i> Attribuer un rôle</div>
        <form th:action="@{/mandates/assign}" method="post" class="form-grid">
            <div class="form-group">
                <label>Membre</label>
                <select name="memberId" required>
                    <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.firstName + ' ' + m.lastName + ' (' + m.email + ')'}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Rôle</label>
                <select name="role" required>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Équipe (si Chef d'équipe)</label>
                <input type="text" name="team" placeholder="Ex: IA & Data Science">
            </div>
            <div style="display:flex;align-items:flex-end;">
                <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;">
                    <i class="ti ti-check"></i> Attribuer
                </button>
            </div>
        </form>
    </div>

    <div class="panel">
        <div class="panel-title"><i class="ti ti-list-check" style="color:var(--copper);"></i> Mandats actifs</div>
        <table>
            <thead>
            <tr>
                <th>Membre</th>
                <th>Rôle</th>
                <th>Équipe</th>
                <th>Depuis</th>
                <th style="text-align:right;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${mandates}">
                <td th:text="${m.member.firstName + ' ' + m.member.lastName}"></td>
                <td><span class="badge badge-permanent" th:text="${m.role}"></span></td>
                <td th:text="${m.team ?: '—'}"></td>
                <td th:text="${m.startDate}"></td>
                <td style="text-align:right;">
                    <form method="post" th:action="@{/mandates/end/{id}(id=${m.id})}"  style="display:inline;" onsubmit="return confirm('Mettre fin à ce mandat ?')"><button type="submit"   class="btn btn-danger btn-sm"
                      >
                        <i class="ti ti-x"></i> Clôturer
                    </button></form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(mandates)}">
                <td colspan="5" style="text-align:center;padding:50px;color:var(--muted);">
                    Aucun mandat actif
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
