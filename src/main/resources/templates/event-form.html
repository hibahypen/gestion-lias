
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Événement</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
    <div class="page-header-inner">
        <div>
            <div class="page-header-label">Événements</div>
            <h1 class="page-header-title">Formulaire événement</h1>
        </div>
        <a href="/events" class="btn btn-secondary"><i class="ti ti-arrow-left"></i> Retour</a>
    </div>
</div>

<div class="content">
    <div class="panel" style="max-width:700px;">
        <form th:action="@{/events/save}" th:object="${event}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label>Titre de l'événement</label>
                <input type="text" th:field="*{title}" placeholder="Ex: Workshop IA & Big Data 2025">
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Type</label>
                    <select th:field="*{type}">
                        <option value="CONFERENCE">Conférence</option>
                        <option value="SEMINAIRE">Séminaire</option>
                        <option value="WORKSHOP">Workshop</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" th:field="*{eventDate}">
                </div>
            </div>

            <!-- Ajout : Organisateurs -->
            <div class="form-group">
                <label>Organisateurs</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:180px;overflow:auto;border:1px solid var(--border, #ddd);border-radius:8px;padding:10px;">
                    <label th:each="m : ${members}" style="display:flex;align-items:center;gap:8px;font-weight:400;">
                        <input type="checkbox" name="organizerIds"
                               th:value="${m.id}"
                               th:checked="${selectedIds.contains(m.id)}">
                        <span th:text="${m.firstName + ' ' + m.lastName}"></span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" rows="4" placeholder="Description de l'événement..."></textarea>
            </div>
            <div style="display:flex;gap:12px;margin-top:8px;">
                <button type="submit" class="btn btn-gold"><i class="ti ti-device-floppy"></i> Enregistrer</button>
                <a href="/events" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
