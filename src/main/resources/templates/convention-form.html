<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>LIAS - Fiche Convention</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <div class="page-header-label">Partenariat</div>
      <h1 class="page-header-title">Éditer une Convention</h1>
    </div>
    <a href="/conventions" class="btn btn-secondary"><i class="ti ti-arrow-left"></i> Retour</a>
  </div>
</div>

<div class="content">
  <div class="panel" style="max-width:800px;">
    <form th:action="@{/conventions/save}" th:object="${convention}" method="post" enctype="multipart/form-data">
      <input type="hidden" th:field="*{id}">
      <div class="form-group">
        <label>Titre de la convention</label>
        <input type="text" th:field="*{title}" required placeholder="Ex: Convention Cadre R&D 2026">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Partenaire associé</label>
          <select name="partnerId" required>
            <option th:each="p : ${partners}" th:value="${p.id}"
                    th:text="${p.name + ' (' + p.type + ')'}"
                    th:selected="${convention.partner != null and convention.partner.id == p.id}"></option>
          </select>
        </div>

        <div class="form-group">
          <label>Statut</label>
          <select th:field="*{status}">
            <option value="ACTIVE">Active</option>
            <option value="EN_NEGOCIATION">En cours de négociation</option>
            <option value="EXPIREE">Expirée</option>
            <option value="RESILIEE">Résiliée</option>
          </select>
        </div>

        <div class="form-group">
          <label>Date de début</label>
          <input type="date" th:field="*{startDate}" required>
        </div>

        <div class="form-group">
          <label>Date de fin</label>
          <input type="date" th:field="*{endDate}" required>
        </div>

        <div class="form-group">
          <label>Budget / Financement alloué (DH)</label>
          <input type="number" step="0.01" th:field="*{budget}" placeholder="Ex: 150000">
        </div>

        <div class="form-group">
          <label>Document PDF signé (Archivage)</label>
          <input type="file" name="file" style="padding:8px;">
        </div>
      </div>

      <!-- Suivi des activités associées (§16) -->
      <div class="form-group">
        <label>Activités & Événements scientifiques associés (§16)</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:160px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px;">
          <label th:each="e : ${events}" style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:13px;">
            <input type="checkbox" name="eventIds" th:value="${e.id}"
                   th:checked="${convention.associatedEvents != null and convention.associatedEvents.contains(e)}">
            <span th:text="${e.title}"></span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Objectifs & Termes de l'accord</label>
        <textarea th:field="*{objectives}" rows="4" placeholder="Détails du partenariat, clauses, livrables..."></textarea>
      </div>

      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn btn-gold"><i class="ti ti-device-floppy"></i> Enregistrer</button>
        <a href="/conventions" class="btn btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
