<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Membre</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
    <div class="page-header-inner">
        <div>
            <div class="page-header-label">Membres</div>
            <h1 class="page-header-title">Fiche membre</h1>
        </div>
        <a href="/members" class="btn btn-secondary"><i class="ti ti-arrow-left"></i> Retour</a>
    </div>
</div>

<div class="content">
    <div class="panel" style="max-width:800px;">
        <form th:action="@{/members/save}" th:object="${member}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-grid">
                <div class="form-group">
                    <label>Prénom</label>
                    <input type="text" th:field="*{firstName}" placeholder="Ex: Youssef">
                </div>
                <div class="form-group">
                    <label>Nom</label>
                    <input type="text" th:field="*{lastName}" placeholder="Ex: El Amrani">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="email@example.com">
                </div>
                <div class="form-group">
                    <label>Mot de passe <span style="font-weight:400;color:var(--muted);">(laisser vide pour ne pas changer)</span></label>
                    <input type="password" name="password" placeholder="••••••••" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Statut</label>
                    <select th:field="*{status}">
                        <option value="PERMANENT">Permanent</option>
                        <option value="ASSOCIE">Associé</option>
                        <option value="DOCTORANT">Doctorant</option>
                        <option value="RETRAITE">Retraité</option>
                        <option value="ANCIEN">Ancien</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Équipe</label>
                    <input type="text" th:field="*{team}" placeholder="Ex: IA & Data Science">
                </div>
                <div class="form-group">
                    <label>Établissement d'origine</label>
                    <input type="text" th:field="*{establishmentOrigin}" placeholder="Ex: Faculté Ben M'Sik">
                </div>
                <div class="form-group">
                    <label>Date d'affiliation</label>
                    <input type="date" th:field="*{dateAffiliation}">
                </div>
                <div class="form-group">
                    <label>Laboratoire d'origine</label>
                    <input type="text" th:field="*{laboratoireOrigine}" placeholder="Ex: LIMA">
                </div>
                <div class="form-group">
                    <label>Date d'embauche</label>
                    <input type="date" th:field="*{dateEmbauche}">
                </div>
                <div class="form-group">
                    <label>Date de naissance <span style="font-weight:400;color:var(--muted);">(confidentielle)</span></label>
                    <input type="date" th:field="*{dateNaissance}">
                </div>
            </div>
            <div class="form-group">
                <label>Biographie</label>
                <textarea th:field="*{biography}" rows="4" placeholder="Description courte..."></textarea>
            </div>
            <div style="display:flex;gap:12px;margin-top:8px;">
                <button type="submit" class="btn btn-gold"><i class="ti ti-device-floppy"></i> Enregistrer</button>
                <a href="/members" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
