<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>LIAS - Nouveau Partenaire</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <div class="page-header-label">Réseau</div>
      <h1 class="page-header-title">Fiche Partenaire</h1>
    </div>
    <a href="/conventions/partners" class="btn btn-secondary"><i class="ti ti-arrow-left"></i> Retour</a>
  </div>
</div>

<div class="content">
  <div class="panel" style="max-width:700px;">
    <form th:action="@{/conventions/partners/save}" th:object="${partner}" method="post">
      <input type="hidden" th:field="*{id}">
      <div class="form-group">
        <label>Nom de l'organisme</label>
        <input type="text" th:field="*{name}" required placeholder="Ex: Groupe OCP, CNRS, Huawei...">
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Type de partenaire</label>
          <select th:field="*{type}">
            <option value="ACADEMIQUE">Académique (Université)</option>
            <option value="INDUSTRIEL">Industriel / Entreprise</option>
            <option value="INSTITUTIONNEL">Institutionnel (Ministère, CNRST)</option>
            <option value="INTERNATIONAL">International</option>
          </select>
        </div>
        <div class="form-group">
          <label>Pays</label>
          <input type="text" th:field="*{country}" required placeholder="Ex: Maroc">
        </div>
        <div class="form-group">
          <label>Ville</label>
          <input type="text" th:field="*{city}" placeholder="Ex: Casablanca">
        </div>
        <div class="form-group">
          <label>Personne contact</label>
          <input type="text" th:field="*{contactPerson}" placeholder="Ex: Pr. Alami">
        </div>
        <div class="form-group">
          <label>Email de contact</label>
          <input type="email" th:field="*{contactEmail}" placeholder="contact@organisme.ma">
        </div>
        <div class="form-group">
          <label>Téléphone</label>
          <input type="text" th:field="*{contactPhone}" placeholder="+212 5...">
        </div>
      </div>
      <div class="form-group">
        <label>Description du partenaire</label>
        <textarea th:field="*{description}" rows="3" placeholder="Présentation succincte..."></textarea>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn btn-gold"><i class="ti ti-device-floppy"></i> Enregistrer le partenaire</button>
        <a href="/conventions/partners" class="btn btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
