<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Publication</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
    <div class="page-header-inner">
        <div>
            <div class="page-header-label">Publications</div>
            <h1 class="page-header-title">Nouvelle publication</h1>
        </div>
        <a href="/publications" class="btn btn-secondary"><i class="ti ti-arrow-left"></i> Retour</a>
    </div>
</div>

<div class="content">
    <div class="panel" style="max-width:700px;">
        <form th:action="@{/publications/save}" th:object="${publication}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label>Titre de la publication</label>
                <input type="text" th:field="*{title}" placeholder="Ex: Deep Learning for Big Data Analytics">
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Type</label>
                    <input type="text" th:field="*{pubType}" placeholder="Article, Conférence, Thèse...">
                </div>
                <div class="form-group">
                    <label>Année</label>
                    <input type="number" th:field="*{pubYear}" placeholder="2025">
                </div>
                <div class="form-group">
                    <label>Journal / Conférence</label>
                    <input type="text" th:field="*{journal}" placeholder="IEEE, Springer...">
                </div>
            </div>
            <div style="display:flex;gap:12px;margin-top:8px;">
                <button type="submit" class="btn btn-gold"><i class="ti ti-device-floppy"></i> Enregistrer</button>
                <a href="/publications" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
