<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Équipe</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
    <div class="page-header-inner">
        <div>
            <div class="page-header-label">Équipes</div>
            <h1 class="page-header-title">Fiche équipe</h1>
        </div>
        <a href="/teams" class="btn btn-secondary"><i class="ti ti-arrow-left"></i> Retour</a>
    </div>
</div>

<div class="content">
    <div class="panel" style="max-width:700px;">
        <form th:action="@{/teams/save}" th:object="${team}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="form-group">
                <label>Nom de l'équipe</label>
                <input type="text" th:field="*{name}" placeholder="Ex: IA & Data Science" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea th:field="*{description}" rows="4" placeholder="Domaine de recherche, objectifs..."></textarea>
            </div>
            <div class="form-group">
                <label>Logo (lien / URL)</label>
                <input type="text" th:field="*{logoUrl}" placeholder="https://...">
            </div>
            <p style="font-size:12px;color:var(--muted);">
                💡 Pour assigner un Chef d'équipe, utilisez la page <a href="/mandates">Mandats</a> en choisissant le rôle
                "CHEF_EQUIPE" et en tapant exactement le même nom d'équipe que ci-dessus.
            </p>
            <div style="display:flex;gap:12px;margin-top:8px;">
                <button type="submit" class="btn btn-gold"><i class="ti ti-device-floppy"></i> Enregistrer</button>
                <a href="/teams" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
