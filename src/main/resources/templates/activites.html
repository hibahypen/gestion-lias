<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Activités</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="pubnav">
    <a href="/" class="brand"><div class="brand-icon"><i class="ti ti-flask"></i></div>LIAS Lab</a>
    <div class="pubnav-links">
        <a href="/">Accueil</a>
        <a href="/equipes">Équipes</a>
        <a href="/activites" class="active">Activités</a>
        <a href="/publications-publiques">Publications</a>
    </div>
    <a href="/login" class="login-btn"><i class="ti ti-login-2"></i>Connexion</a>
</div>

<div class="pub-content">
    <div class="pub-page-title">Nos activités scientifiques</div>
    <div class="pub-page-sub">Conférences, séminaires et workshops organisés par le laboratoire LIAS</div>

    <div class="event-pub-list">
        <div class="event-pub-item" th:each="event : ${events}">
            <div class="event-pub-date">
                <div class="day" th:text="${#temporals.format(event.eventDate, 'dd')}">01</div>
                <div class="month" th:text="${#temporals.format(event.eventDate, 'MMM')}">JAN</div>
            </div>
            <div>
                <div style="font-size:15px;font-weight:700;color:var(--emerald);" th:text="${event.title}"></div>
                <span class="badge badge-conference" style="margin-top:4px;display:inline-block;" th:text="${event.type}"></span>
            </div>
        </div>
    </div>
</div>

<div class="footer-pub">© 2026 Laboratoire LIAS — Faculté des Sciences Ben M'Sik</div>

</body>
</html>
