<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Calendrier Scientifique (§20)</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
    <div class="page-header-inner">
        <div>
            <div class="page-header-label">Cahier des charges §20</div>
            <h1 class="page-header-title">Calendrier & Navigation Temporelle (<span th:text="${selectedYear}">2026</span>)</h1>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
            <a th:href="@{/calendrier(year=${selectedYear - 1})}" class="btn btn-secondary btn-sm"><i class="ti ti-chevron-left"></i> <span th:text="${selectedYear - 1}"></span></a>
            <span style="font-weight:800;font-size:16px;color:var(--emerald);" th:text="${selectedYear}"></span>
            <a th:href="@{/calendrier(year=${selectedYear + 1})}" class="btn btn-secondary btn-sm"><span th:text="${selectedYear + 1}"></span> <i class="ti ti-chevron-right"></i></a>
        </div>
    </div>
</div>

<div class="content">

    <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;">
        <div th:each="m : ${months}" class="panel" style="margin:0;min-height:220px;display:flex;flex-direction:column;">
            <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--border);padding-bottom:8px;margin-bottom:12px;">
                <strong style="color:var(--emerald);text-transform:uppercase;font-size:14px;" th:text="${m.name()}">MOIS</strong>
                <span class="badge badge-permanent" style="font-size:11px;" th:text="${#lists.size(eventsByMonth.get(m.getValue()))} + ' évèn.'">0</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:8px;flex:1;">
                <div th:each="ev : ${eventsByMonth.get(m.getValue())}"
                     style="background:var(--sand);border-radius:8px;padding:8px 10px;border-left:3px solid var(--copper);">
                    <div style="font-weight:700;font-size:12px;color:var(--ink);" th:text="${ev.title}">Titre</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:11px;color:var(--muted);">
                        <span th:text="${#temporals.format(ev.eventDate, 'dd/MM')}">01/01</span>
                        <span class="badge badge-conference" style="font-size:9px;" th:text="${ev.type}">CONF</span>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(eventsByMonth.get(m.getValue()))}" style="margin:auto 0;text-align:center;color:#b0bbc8;font-size:12px;">
                    Aucune manifestation
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
