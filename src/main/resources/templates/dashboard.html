<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Dashboard</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<!-- Hero -->
<div class="hero">
    <div style="max-width:1200px;margin:0 auto;">
        <div style="font-size:12px;color:var(--copper-light);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;">
            Espace connecté
        </div>
        <div class="hero-title">Tableau de bord</div>
        <div class="hero-sub">Laboratoire LIAS — Faculté des Sciences Ben M'Sik</div>
    </div>
</div>

<!-- Stats -->
<div class="stats-row">
    <div class="stat-card">
        <div>
            <div class="stat-num" th:text="${permanents}">0</div>
            <div class="stat-label">Permanents</div>
        </div>
        <div class="stat-card-icon" style="background:#EAF3DE;color:#3B6D11;">
            <i class="ti ti-users"></i>
        </div>
    </div>
    <div class="stat-card">
        <div>
            <div class="stat-num" th:text="${doctorants}">0</div>
            <div class="stat-label">Doctorants</div>
        </div>
        <div class="stat-card-icon" style="background:#E6F1FB;color:#185FA5;">
            <i class="ti ti-school"></i>
        </div>
    </div>
    <div class="stat-card">
        <div>
            <div class="stat-num" th:text="${events}">0</div>
            <div class="stat-label">Événements</div>
        </div>
        <div class="stat-card-icon" style="background:#FAEEDA;color:#854F0B;">
            <i class="ti ti-calendar-event"></i>
        </div>
    </div>
    <div class="stat-card">
        <div>
            <div class="stat-num" th:text="${publications}">0</div>
            <div class="stat-label">Publications</div>
        </div>
        <div class="stat-card-icon" style="background:#EEEDFE;color:#3C3489;">
            <i class="ti ti-book"></i>
        </div>
    </div>
</div>

<!-- Content -->
<div class="content">

    <!-- Direction -->
    <div class="panel">
        <div class="panel-title">
            <i class="ti ti-crown" style="color:var(--copper);"></i> Direction actuelle
        </div>
        <div style="display:flex;align-items:center;gap:16px;padding:16px;background:var(--sand);border-radius:12px;">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--emerald);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;">DR</div>
            <div>
                <div style="font-weight:700;font-size:15px;color:var(--emerald);" th:text="${directeur}">Non défini</div>
                <div style="color:var(--muted);font-size:13px;">Directeur du laboratoire LIAS</div>
            </div>
            <span class="badge badge-permanent" style="margin-left:auto;">Mandat actif</span>
        </div>
    </div>

    <!-- Accès rapide premium -->
    <div class="panel">
        <div class="panel-title">
            <i class="ti ti-bolt" style="color:var(--copper);"></i> Accès rapide
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
            <a href="/members/new" style="background:var(--emerald);color:white;border-radius:14px;padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:0.3s;" onmouseover="this.style.background='var(--emerald-light)'" onmouseout="this.style.background='var(--emerald)'">
                <i class="ti ti-user-plus" style="font-size:22px;"></i>
                <div style="font-weight:700;font-size:13px;">Nouveau membre</div>
            </a>
            <a href="/events/new" style="background:var(--copper);color:white;border-radius:14px;padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:0.3s;" onmouseover="this.style.background='var(--copper-light)'" onmouseout="this.style.background='var(--copper)'">
                <i class="ti ti-calendar-plus" style="font-size:22px;"></i>
                <div style="font-weight:700;font-size:13px;">Nouvel événement</div>
            </a>
            <a href="/publications/new" style="background:#3C3489;color:white;border-radius:14px;padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;transition:0.3s;">
                <i class="ti ti-file-plus" style="font-size:22px;"></i>
                <div style="font-weight:700;font-size:13px;">Nouvelle publication</div>
            </a>
            <a href="/members" style="background:var(--sand);color:var(--emerald);border-radius:14px;padding:20px;text-decoration:none;display:flex;flex-direction:column;gap:10px;border:1px solid var(--border);transition:0.3s;">
                <i class="ti ti-list" style="font-size:22px;"></i>
                <div style="font-weight:700;font-size:13px;">Tous les membres</div>
            </a>
        </div>
    </div>

</div>

</body>
</html>
