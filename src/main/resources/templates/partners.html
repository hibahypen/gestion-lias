<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>LIAS - Partenaires</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <div class="page-header-label">Réseau du laboratoire</div>
      <h1 class="page-header-title">Organismes Partenaires</h1>
    </div>
    <a sec:authorize="hasAnyRole('ADMIN','DIRECTEUR')" href="/conventions/partners/new" class="btn btn-gold">
      <i class="ti ti-plus"></i> Nouveau partenaire
    </a>
  </div>
</div>

<div class="content">
  <div class="panel">
    <table>
      <thead>
      <tr>
        <th>Organisme</th>
        <th>Type</th>
        <th>Pays / Ville</th>
        <th>Contact</th>
        <th style="text-align:right;" sec:authorize="hasAnyRole('ADMIN','DIRECTEUR')">Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="p : ${partners}">
        <td>
          <strong th:text="${p.name}"></strong>
          <div style="font-size:12px;color:var(--muted);" th:text="${p.description}"></div>
        </td>
        <td><span class="badge badge-permanent" th:text="${p.type}"></span></td>
        <td style="font-size:13px;" th:text="${p.country + (p.city != null ? ' - ' + p.city : '')}"></td>
        <td>
          <div style="font-size:13px;" th:text="${p.contactPerson}"></div>
          <div style="font-size:12px;color:var(--muted);" th:text="${p.contactEmail}"></div>
        </td>
        <td style="text-align:right;" sec:authorize="hasAnyRole('ADMIN','DIRECTEUR')">
          <form method="post" th:action="@{/conventions/partners/delete/{id}(id=${p.id})}"  style="display:inline;" onsubmit="return confirm('Supprimer ce partenaire ?')"><button type="submit"   class="btn btn-danger btn-sm"><i class="ti ti-trash"></i></button></form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

</body>
</html>
