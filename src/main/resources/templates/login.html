<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Connexion</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-logo"><i class="ti ti-flask"></i></div>
        <div class="login-title">LIAS Lab</div>
        <div class="login-sub">Connectez-vous à votre espace</div>

        <div th:if="${param.error}" class="login-error">
            <i class="ti ti-alert-circle"></i> Identifiants incorrects
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="vous@lias.ma" autofocus>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-gold" style="width:100%;justify-content:center;">
                <i class="ti ti-login-2"></i> Se connecter
            </button>
        </form>

        <div class="login-footer">
            Pas encore membre ? <a th:href="@{/adhesion}">Rejoindre le laboratoire</a>
        </div>
        <div class="login-footer">
            Laboratoire LIAS — Faculté Ben M'Sik
        </div>
    </div>
</div>

</body>
</html>
