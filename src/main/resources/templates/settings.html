<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Paramètres</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
    <div class="page-header-inner">
        <div>
            <div class="page-header-label">Administration</div>
            <h1 class="page-header-title">Paramètres système</h1>
        </div>
    </div>
</div>

<div class="content">

    <div class="panel">
        <div class="panel-title"><i class="ti ti-users" style="color:var(--copper);"></i> Comptes d'accès (<span th:text="${#lists.size(members)}">0</span>)</div>
        <table>
            <thead>
            <tr>
                <th>Utilisateur</th>
                <th>Email</th>
                <th>Rôle</th>
                <th>Statut</th>
                <th>Accès</th>
                <th style="text-align:right;">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${members}">
                <td>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <div class="avatar-initials">
                            <span th:if="${m.firstName != null and !#strings.isEmpty(m.firstName)}" th:text="${#strings.toUpperCase(#strings.substring(m.firstName,0,1))}">U</span>
                            <span th:if="${m.lastName != null and !#strings.isEmpty(m.lastName)}" th:text="${#strings.toUpperCase(#strings.substring(m.lastName,0,1))}">S</span>
                        </div>
                        <strong th:text="${(m.firstName != null ? m.firstName : '') + ' ' + (m.lastName != null ? m.lastName : '')}"></strong>
                    </div>
                </td>
                <td style="color:var(--muted);font-size:13px;" th:text="${m.email != null ? m.email : '—'}"></td>
                <td><span class="badge" style="background:#FEF3E2;color:#854F0B;" th:text="${m.role != null ? m.role : 'MEMBRE'}">MEMBRE</span></td>
                <td>
                    <span th:if="${m.status != null}" class="badge badge-permanent" th:text="${m.status}">PERMANENT</span>
                    <span th:unless="${m.status != null}" class="badge badge-ancien">—</span>
                </td>
                <td>
                    <span th:if="${m.active and (m.status == null or (m.status.name() != 'RETRAITE' and m.status.name() != 'ANCIEN'))}" class="badge badge-permanent">Actif</span>
                    <span th:if="${m.status != null and m.status.name() == 'RETRAITE'}" class="badge badge-associe">Gelé</span>
                    <span th:if="${!m.active or (m.status != null and m.status.name() == 'ANCIEN')}" class="badge badge-ancien">Désactivé</span>
                </td>
                <td style="text-align:right;">
                    <a th:href="@{/members/edit/{id}(id=${m.id})}" class="btn btn-secondary btn-sm"><i class="ti ti-edit"></i></a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="panel">
        <div class="panel-title"><i class="ti ti-info-circle" style="color:var(--copper);"></i> Informations système</div>
        <div class="action-grid">
            <div style="background:var(--sand);border-radius:12px;padding:20px;">
                <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:6px;">Framework</div>
                <div style="font-weight:700;color:var(--emerald);">Spring Boot 3.2.5</div>
            </div>
            <div style="background:var(--sand);border-radius:12px;padding:20px;">
                <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:6px;">Base de données</div>
                <div style="font-weight:700;color:var(--emerald);">MySQL — lias_db</div>
            </div>
            <div style="background:var(--sand);border-radius:12px;padding:20px;">
                <div style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:6px;">Port</div>
                <div style="font-weight:700;color:var(--emerald);">8081</div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
