<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>LIAS - Demandes de Matériel</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
    <div class="page-header-inner">
        <div>
            <div class="page-header-label">Gestion des besoins (§15)</div>
            <h1 class="page-header-title">Demandes d'Équipements & Validation</h1>
        </div>
        <a href="/materials/requests/new" class="btn btn-gold"><i class="ti ti-plus"></i> Nouvelle demande</a>
    </div>
</div>

<div class="content">
    <div class="panel">
        <table>
            <thead>
            <tr>
                <th>Demandeur</th>
                <th>Besoin exprimé</th>
                <th>Justification</th>
                <th>Date</th>
                <th>Statut</th>
                <th style="text-align:right;" sec:authorize="hasAnyRole('ADMIN','DIRECTEUR')">Décision</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${requests}">
                <td>
                    <strong th:text="${r.member.firstName + ' ' + r.member.lastName}"></strong>
                    <div style="font-size:12px;color:var(--muted);" th:text="${r.member.email}"></div>
                </td>
                <td>
                    <div style="font-weight:700;color:var(--emerald);" th:text="${r.materialName}"></div>
                    <div style="font-size:12px;color:var(--muted);" th:text="'Qté : ' + ${r.quantity}"></div>
                </td>
                <td style="font-size:13px;max-width:300px;" th:text="${r.justification}"></td>
                <td style="font-size:13px;color:var(--muted);" th:text="${#temporals.format(r.requestDate,'dd/MM/yyyy')}"></td>
                <td>
                    <span th:if="${r.status.name() == 'EN_ATTENTE'}" class="badge badge-doctorant">En attente</span>
                    <span th:if="${r.status.name() == 'VALIDEE'}" class="badge badge-permanent">Validée</span>
                    <span th:if="${r.status.name() == 'REFUSEE'}" class="badge badge-ancien">Refusée</span>
                </td>
                <td style="text-align:right;" sec:authorize="hasAnyRole('ADMIN','DIRECTEUR')">
                    <div th:if="${r.status.name() == 'EN_ATTENTE'}" style="display:flex;gap:6px;justify-content:flex-end;">
                        <form method="post" th:action="@{/materials/requests/accept/{id}(id=${r.id})}"  style="display:inline;"><button type="submit"   class="btn btn-gold btn-sm"><i class="ti ti-check"></i> Valider</button></form>
                        <form method="post" th:action="@{/materials/requests/refuse/{id}(id=${r.id})}"  style="display:inline;" onsubmit="return confirm('Refuser cette demande ?')"><button type="submit"   class="btn btn-danger btn-sm"><i class="ti ti-x"></i> Refuser</button></form>
                    </div>
                    <span th:unless="${r.status.name() == 'EN_ATTENTE'}" style="font-size:12px;color:var(--muted);"
                          th:text="'Par ' + (${r.handledBy != null ? r.handledBy.firstName : 'Direction'})"></span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(requests)}">
                <td colspan="6" style="text-align:center;padding:50px;color:var(--muted);">
                    <i class="ti ti-inbox" style="font-size:36px;display:block;margin-bottom:10px;opacity:0.3;"></i>
                    Aucune demande de matériel enregistrée.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
