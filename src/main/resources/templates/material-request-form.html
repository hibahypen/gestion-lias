<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>LIAS - Exprimer un besoin</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav th:replace="~{fragments/navigation :: navbar}"></nav>

<div class="page-header">
  <div class="page-header-inner">
    <div>
      <div class="page-header-label">Cahier des charges §15</div>
      <h1 class="page-header-title">Exprimer un besoin en matériel</h1>
    </div>
    <a href="/materials/requests" class="btn btn-secondary"><i class="ti ti-arrow-left"></i> Retour</a>
  </div>
</div>

<div class="content">
  <div class="panel" style="max-width:700px;">
    <p style="font-size:13px;color:var(--muted);margin-bottom:20px;">
      Votre demande sera soumise à la direction du laboratoire LIAS. Précisez bien la justification scientifique ou technique pour accélérer la validation.
    </p>
    <form th:action="@{/materials/requests/save}" th:object="${materialRequest}" method="post">
      <div class="form-grid">
        <div class="form-group" style="grid-column:1/-1;">
          <label>Matériel souhaité</label>
          <input type="text" th:field="*{materialName}" required placeholder="Ex: Carte Graphique RTX 3080 pour entraînement de modèles Deep Learning">
        </div>
        <div class="form-group">
          <label>Quantité</label>
          <input type="number" th:field="*{quantity}" min="1" value="1" required>
        </div>
      </div>
      <div class="form-group">
        <label>Justification scientifique / technique</label>
        <textarea th:field="*{justification}" rows="4" required placeholder="Expliquez les besoins de votre recherche ou projet..."></textarea>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn btn-gold"><i class="ti ti-send"></i> Transmettre ma demande</button>
        <a href="/materials/requests" class="btn btn-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>
